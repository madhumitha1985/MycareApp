<!DOCTYPE html>
<html>
<head>
  <title>Patient Priority Planner</title>

  <style>
    body {
      font-family: Arial;
      background: #f2f6ff;
      margin: 0;
      padding: 0;

      /* FULL CENTER ALIGN FIX */
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .box {
      background: white;
      padding: 30px;
      width: 350px;
      border-radius: 15px;
      box-shadow: 0px 0px 15px #ccc;
      text-align: center;
    }

    h2 {
      margin-bottom: 20px;
      color: #2c3e50;
    }

    select {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border-radius: 8px;
      margin-top: 10px;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      border: none;
      border-radius: 8px;
      background: #2c7be5;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #1a5fd0;
    }

    #output {
      margin-top: 20px;
      text-align: left;
      background: #e8f0ff;
      padding: 15px;
      border-radius: 10px;
    }
  </style>
</head>

<body>

<div class="box">

  <h2>👨‍⚕️ Patient Priority Planner</h2>

  <select id="patient">
    <option value="">-- Select Patient Type --</option>
    <option value="sugar">Sugar Patient</option>
    <option value="bp">BP Patient</option>
    <option value="pregnant">Pregnant Lady</option>
    <option value="elder">Elderly Person</option>
    <option value="cancer">Cancer Patient</option>
  </select>

  <button onclick="showAdvice()">Get Advice</button>

  <div id="output"></div>

</div>

<script>
function showAdvice() {
  let type = document.getElementById("patient").value;
  let output = document.getElementById("output");

  if(type === "sugar") {
    output.innerHTML = "🍬 Sugar: No sugar, walk daily, avoid junk food";
  }
  else if(type === "bp") {
    output.innerHTML = "❤️ BP: Low salt diet, yoga, avoid fried food";
  }
  else if(type === "pregnant") {
    output.innerHTML = "🤰 Pregnant: Iron food, milk, rest well";
  }
  else if(type === "elder") {
    output.innerHTML = "👴 Elder: Light food, slow walk, avoid spice";
  }
  else if(type === "cancer") {
    output.innerHTML = "🎗️ Cancer: Protein food, fluids, doctor care";
  }
  else {
    output.innerHTML = "Please select patient type";
  }
}
</script>

</body>
</html>
