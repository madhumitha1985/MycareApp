<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MycareApp</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#0f172a,#1e3a8a);
min-height:100vh;
padding:20px;
}

.header{
text-align:center;
color:white;
margin-bottom:25px;
}

.logo{
width:110px;
height:110px;
background:white;
border-radius:50%;
margin:auto;
display:flex;
justify-content:center;
align-items:center;
font-size:50px;
box-shadow:0 0 20px rgba(255,255,255,0.3);
}

.header h1{
margin-top:15px;
font-size:30px;
}

.header p{
opacity:0.8;
}

.welcome{
background:rgba(255,255,255,0.15);
backdrop-filter:blur(10px);
color:white;
padding:15px;
border-radius:15px;
margin-bottom:20px;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
}

.card{
background:white;
border-radius:20px;
padding:20px;
text-align:center;
text-decoration:none;
color:#1e3a8a;
font-weight:bold;
box-shadow:0 5px 15px rgba(0,0,0,0.2);
transition:0.3s;
}

.card:hover{
transform:scale(1.05);
}

.icon{
font-size:40px;
margin-bottom:10px;
}

.footer{
text-align:center;
color:white;
margin-top:25px;
font-size:14px;
}

</style>
</head>

<body>

<div class="header">

<div class="logo">
🏥
</div>

<h1>MycareApp</h1>
<p>Your Personal Health Assistant</p>

</div>

<div class="welcome">
<h3>👋 Welcome</h3>
<p>Manage patients, medicines and reports easily.</p>
</div>

<div class="grid">

<a href="diet.html" class="card">
<div class="icon">🥗</div>
Diet Planner
</a>

<a href="patient_priority.html" class="card">
<div class="icon">👨‍⚕️</div>
Patient Priority
</a>

<a href="tablet_reminder.html" class="card">
<div class="icon">💊</div>
Tablet Reminder
</a>

<a href="scanner.html" class="card">
<div class="icon">📷</div>
Tablet Scanner
</a>

<a href="nearby.html" class="card">
<div class="icon">📍</div>
Nearby Hospital
</a>

<a href="reports.html" class="card">
<div class="icon">📄</div>
Reports
</a>

</div>

<div class="footer">
❤️ Stay Healthy • Stay Safe
</div>

</body>
</html>
