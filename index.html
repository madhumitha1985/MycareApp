<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MycareApp</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#0f172a,#1e3a8a);
min-height:100vh;
padding:20px;
}

.header{
text-align:center;
color:white;
margin-bottom:25px;
}

.logo{
width:100px;
height:100px;
background:white;
border-radius:50%;
margin:auto;
display:flex;
justify-content:center;
align-items:center;
font-size:45px;
}

.header h1{
margin-top:15px;
}

.welcome{
background:rgba(255,255,255,0.15);
color:white;
padding:15px;
border-radius:15px;
margin-bottom:20px;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
}

.card{
background:white;
border-radius:20px;
padding:20px;
text-align:center;
text-decoration:none;
color:#1e3a8a;
font-weight:bold;
box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

.icon{
font-size:40px;
margin-bottom:10px;
}

.footer{
text-align:center;
color:white;
margin-top:20px;
}

</style>
</head>

<body>

<div class="header">
<div class="logo">🏥</div>
<h1>MycareApp</h1>
<p>Your Personal Health Assistant</p>
</div>

<div class="welcome">
<h3>👋 Welcome</h3>
<p>Manage your health records easily.</p>
</div>

<div class="grid">

<a href="reports.html" class="card">
<div class="icon">📄</div>
Reports
</a>

<a href="doctor_connect.html" class="card">
<div class="icon">👨‍⚕️</div>
Doctor Connect
</a>

<a href="#" class="card">
<div class="icon">💊</div>
Medicine Reminder
</a>

<a href="#" class="card">
<div class="icon">📅</div>
Appointments
</a>

<a href="#" class="card">
<div class="icon">🥗</div>
Diet Planner
</a>

<a href="#" class="card">
<div class="icon">📍</div>
Nearby Hospital
</a>

</div>

<div class="footer">
❤️ Stay Healthy • Stay Safe
</div>

</body>
</html>
