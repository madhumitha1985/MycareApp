<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MycareApp</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#0f172a,#1e3a8a);
min-height:100vh;
padding:20px;
}

/* TITLE */
h1{
text-align:center;
color:white;
margin-bottom:20px;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(2, 1fr);
gap:15px;
margin-top:20px;
}

/* CARD STYLE */
.card{
background:white;
color:#1e3a8a;
padding:20px;
text-align:center;
border-radius:15px;
text-decoration:none;
font-weight:bold;
font-size:16px;
box-shadow:0 5px 15px rgba(0,0,0,0.2);
transition:0.2s;
display:block;
}

.card:active{
transform:scale(0.96);
}

.card:hover{
transform:scale(1.03);
}

/* MOBILE RESPONSIVE */
@media screen and (max-width: 768px){
.grid{
grid-template-columns:1fr;
}

.card{
font-size:18px;
padding:25px;
}

body{
padding:10px;
}

h1{
font-size:24px;
}
}
</style>
</head>

<body>

<h1>🏥 MycareApp</h1>

<div class="grid">

<a class="card" href="login.html">🔐 Login</a>

<a class="card" href="doctor_connect.html">👨‍⚕️ Doctor Connect</a>

<a class="card" href="reports.html">📄 Reports</a>

<a class="card" href="appointments.html">📅 Appointments</a>

<a class="card" href="medicine.html">💊 Medicine</a>

<a class="card" href="diet.html">🥗 Diet</a>

<a class="card" href="nearby.html">📍 Nearby Hospital</a>

<a class="card" href="emergency.html">🚨 Emergency SOS</a>

<a class="card" href="patient_priority.html">⭐ Patient Priority</a>

<a class="card" href="scanner.html">📷 Scanner</a>

<a class="card" href="tablet_reminder.html">⏰ Reminder</a>

</div>

</body>
</html>
