<!DOCTYPE html>
<html>
<head>
  <title>Nearby Hospitals</title>

  <style>
    body {
      font-family: Arial;
      background: #f2f6ff;
      text-align: center;
      margin: 0;
      padding: 20px;
    }

    .box {
      background: white;
      padding: 20px;
      max-width: 450px;
      margin: auto;
      border-radius: 15px;
      box-shadow: 0px 0px 10px #ccc;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 8px;
      border: none;
      background: #2c7be5;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    iframe {
      width: 100%;
      height: 300px;
      margin-top: 15px;
      border-radius: 10px;
      border: none;
    }

    .info {
      margin-top: 10px;
      font-size: 14px;
      color: #444;
    }
  </style>
</head>

<body>

<div class="box">

  <h2>📍 Nearby Hospitals & Pharmacies</h2>

  <button onclick="findLocation()">📡 Find My Location</button>

  <div class="info" id="status"></div>

  <iframe id="map"
    src="https://www.google.com/maps?q=hospital+near+me&output=embed">
  </iframe>

</div>

<script>

function findLocation() {

  document.getElementById("status").innerText = "Detecting location...";

  if (navigator.geolocation) {

    navigator.geolocation.getCurrentPosition(showPosition, showError);

  } else {
    alert("Geolocation not supported");
  }
}

function showPosition(position) {

  let lat = position.coords.latitude;
  let lon = position.coords.longitude;

  document.getElementById("status").innerText =
    "Location found ✔";

  let mapUrl =
    "https://www.google.com/maps?q=hospital&ll=" + lat + "," + lon + "&z=14&output=embed";

  document.getElementById("map").src = mapUrl;
}

function showError() {
  alert("Location access denied ❌");
}

</script>

</body>
</html>
