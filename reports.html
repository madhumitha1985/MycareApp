<!DOCTYPE html>
<html>
<head>
  <title>Patient Reports</title>

  <style>
    body{
      font-family: Arial;
      background:#f2f6ff;
      padding:20px;
    }

    h2{
      color:#2c7be5;
    }

    .card{
      background:white;
      padding:15px;
      margin-top:10px;
      border-radius:10px;
      box-shadow:0 0 8px #ccc;
    }
  </style>
</head>

<body>

<h2>📂 Patient Reports (Live from Firebase)</h2>

<div id="data"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBHDPkFeTFAxMIz58giimCmrMtceETQlO0",
  authDomain: "mycareapp-2a112.firebaseapp.com",
  projectId: "mycareapp-2a112",
  storageBucket: "mycareapp-2a112.firebasestorage.app",
  messagingSenderId: "691576489035",
  appId: "1:691576489035:web:d7f1d29d7b49c44941f9ce",
  measurementId: "G-GL281H9HT5"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

async function loadData() {

  const container = document.getElementById("data");
  container.innerHTML = "";

  const querySnapshot = await getDocs(
    collection(db, "reports")
  );

  querySnapshot.forEach((doc) => {

    const d = doc.data();

    container.innerHTML += `
      <div class="card">
        👤 Name: ${d.name || ""}
        <br><br>

        💊 Tablet: ${d.tablet || ""}
        <br><br>

        ⏰ Time: ${d.time || d.Time || ""}
      </div>
    `;
  });
}

loadData();

</script>

</body>
</html>
