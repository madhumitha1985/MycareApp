<!DOCTYPE html>
<html>
<head>
  <title>Tablet Reminder</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial;
      background: #f2f6ff;
      margin: 0;
      padding: 15px;
      display: flex;
      justify-content: center;
    }

    .box {
      background: white;
      padding: 20px;
      width: 100%;
      max-width: 400px;   /* FIX: prevents overflow */
      border-radius: 15px;
      box-shadow: 0px 0px 10px #ccc;
      text-align: center;
    }

    input, select, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      background: #2c7be5;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background: #1a5fd0;
    }

    .item {
      background: #e8f0ff;
      padding: 10px;
      margin-top: 10px;
      border-radius: 10px;
      text-align: left;
      word-wrap: break-word;
    }

    h2 {
      font-size: 20px;
    }
  </style>
</head>

<body>

<div class="box">

  <h2>⏰ Tablet Reminder</h2>

  <input type="text" id="tablet" placeholder="Tablet Name">

  <input type="time" id="time">

  <select id="food">
    <option>Before Food</option>
    <option>After Food</option>
  </select>

  <button onclick="addReminder()">Set Reminder</button>

  <div id="list"></div>

</div>

<script>

let reminders = JSON.parse(localStorage.getItem("reminders")) || [];

showList();
checkReminder();

function addReminder() {

  let tablet = document.getElementById("tablet").value;
  let time = document.getElementById("time").value;
  let food = document.getElementById("food").value;

  if(tablet === "" || time === "") {
    alert("Fill all fields");
    return;
  }

  reminders.push({tablet, time, food});

  localStorage.setItem("reminders", JSON.stringify(reminders));

  showList();
}

function showList() {

  let list = document.getElementById("list");
  list.innerHTML = "";

  reminders.forEach(r => {
    list.innerHTML += `
      <div class="item">
        💊 ${r.tablet}<br>
        ⏰ ${r.time}<br>
        🍽️ ${r.food}
      </div>
    `;
  });
}

function checkReminder() {

  setInterval(() => {

    let now = new Date();
    let current = now.getHours().toString().padStart(2,'0') + ":" +
                  now.getMinutes().toString().padStart(2,'0');

    reminders.forEach(r => {
      if(r.time === current) {
        alert("🔔 TAKE MEDICINE: " + r.tablet);
      }
    });

  }, 30000);
}

</script>

</body>
</html>
